  <!--
    IMPECCABLE DIRECTION CONTRACT — Echo landing page — key ECHO-TWD-01

    THESIS: A feed is a volume of decisions; the only question is whether you are shown
    them. So the page is a working drawing, not a broadsheet — drafted, not typeset —
    and it refuses the two arrangements this category always ships: the floating-phone
    hero and the metric row.

    OWN-WORLD: Sheet stock #F8F8F6 on a light table #EEEDE9. Graphite #252A31 is the
    platform's fixed structure, construction blue #0D436D is the visitor's own decision,
    revision oxide #B4442E is only what they excluded. Three registers: Barlow Condensed
    drafted, Fragment Mono typed, Barlow written. Vellum overlays veil — saturate and
    brighten — never blur. Paper fibre printed into the stock.

    STORY: You arrive, set eight fields, and watch the rule you wrote decide — including
    what it removed and why. By sheet E-06 you have already used the product.

    FIRST VIEWPORT: Sheet E-01 on the table. Header band, then "A feed you can / read, and
    redraw" in condensed graphite at architectural scale, the live rule expression on
    vellum, and the schedule of parameters beside the drawing it produces.

    FORM: Architectural working-drawing set, six sheets. User-pinned direction; no roll.
    Motion: one inherited --draw value, so a sheet arrives as one pass of the straightedge.

    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
    review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
  -->

  <script type="module" src="/src/main.jsx"></script>
